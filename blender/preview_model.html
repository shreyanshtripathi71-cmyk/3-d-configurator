<!DOCTYPE html>
<html>
<head>
<title>Casement 2H1V Preview</title>
<style>
  body { margin: 0; background: #f0f0f0; font-family: system-ui; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: absolute; top: 10px; left: 10px; color: #333; background: rgba(255,255,255,0.9); padding: 12px 18px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<div id="info">Casement 2H×1V — Drag to rotate, scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(0, 0.3, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 0.8);
key.position.set(2, 6, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-4, 4, -2);
scene.add(fill);
const front = new THREE.DirectionalLight(0xffffff, 0.6);
front.position.set(0, 0, 10);
scene.add(front);

const loader = new GLTFLoader();
loader.load('../public/windows/casement/Casement_2H1V.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);
  
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  
  document.getElementById('info').textContent += 
    ` | Size: ${size.x.toFixed(3)} × ${size.y.toFixed(3)} × ${size.z.toFixed(3)}`;
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
